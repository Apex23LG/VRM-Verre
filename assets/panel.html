<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Bar Example</title>
    <style>
        /* Radial progress bar wrapper */
        .radial-progress {
            position: relative;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: conic-gradient(#3255c7 0%, #3255c7 var(--progress), #6fa4f5 var(--progress), #6fa4f5 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Inner circle to create the "donut" effect */
        .radial-progress::before {
            content: '';
            position: absolute;
            width: 80%;
            height: 80%;
            border-radius: 50%;
            background: white;
        }

        .radial-progress-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .percentage {
            position: relative;
            font-size: 24px;
            font-weight: bold;
            color: #3255c7;
        }

        .panel_table {
            overflow: auto;
            width: 100%;
        }
        
        .panel_table table {
            border: 1px solid #dededf;
            height: 100%;
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
            border-spacing: 1px;
            text-align: left;
        }
        
        .panel_table caption {
            caption-side: top;
            text-align: left;
        }
        
        .panel_table th {
            color: #000000;
            padding: 1px;
        }
        
        .panel_table td {
            background-color: #f0f8ff;
            color: #000000;
            padding: px;
            text-align: center;
        }
        .icon{
            height: 40px;
            width: 40px;
        }
        .goleador-pack {
              text-align: center;
}
        .goleador {
            display: inline;
            vertical-align: middle;
            float:left;
            padding-right: 3px;
            padding-left:3px;
}
        
    </style>

    <script>    
        var battery = '{{soc}}' ; //this line in the Ide will show as an error.
        
        var radialProgress = document.getElementById('radialProgress');
        var percentageText = document.getElementById('percentageText');
        // Calculate the progress in degrees (360 degrees = 100%)
        var progress = (battery / 100) * 360;
        //Update the CSS variable for the conic-gradient
        radialProgress.style.setProperty('--progress', `${progress}deg`);
        // Update the percentage text
        percentageText.textContent = `${battery}%`;
    </script>
</head>

<body> 
        <div class="panel_table" role="region" tabindex="0">
        <table>
            <caption><br></caption>
            <thead>
                <tr>
                    <td>
                        <div class="goleador-pack">
                             <div class="goleador">
                                <img src="/wordpress/wp-content/plugins/vrm-verre/assets/icons/wheel.png" alt="Voltage Icon" class="icon">
                            </div>
                            <div class="goleador">
                                <p>Tensione: {{voltage}} V</p>
                            </div>
                          </div>
                          <div class="goleador-pack">
                            <div class="goleador"> <img src="/wordpress/wp-content/plugins/vrm-verre/assets/icons/camera.png" alt="Current Icon" class="icon">
                            </div>
                            <div class="goleador"><p>Corrente: {{current}} A</p>
                            </div>
                        </div>
                          <p></p>
                    </td>
                    <td>
                        <div class="radial-progress-container">
                        <div class="radial-progress" id="radialProgress">
                        <div class="percentage" id="percentageText">
                            0%
                        </div></div></div>
                    </td>
                    <td>
                        <div class="goleador-pack">
                            <div class="goleador">
                                <img src="/wordpress/wp-content/plugins/vrm-verre/assets/icons/power.png" alt="Voltage Icon" class="icon">
                            </div>
                            <div class="goleador">
                                <p>Potenza: {{power}} W</p>
                            </div>
                        </div>
                        <p>Consumo: {{consumedAh}} Ah</p>
                    </td>
                </tr>
                <tr>
                    <td>
                        <p>Temperatura: {{temperature}} °C</p>
                    </td>
                    <td>
                        <p>Tempo rimanente: {{timeToGo}} secondi</p>
                    </td>
                    <td> 
                        <p>Allarme: {{alarm}}</p>
                        <p>Motivo allarme: {{alarmReason}}</p>
                    </td>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        </div>
    <!-- panel html-->

</body>
</html>
